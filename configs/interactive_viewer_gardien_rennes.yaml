# python scripts/interactive_viewer.py --config configs/interactive_viewer_gardien_rennes.yaml
sequence:
  name: gardien_rennes
  fps: 50

paths:
  pitch_points: data/pitch/gardien_rennes.txt
  teams: data/teams/gardien_rennes.txt

render:
  colors:
    team_a: [30, 120, 255]
    team_b: [255, 140, 0]
    fallback: [180, 180, 180]
    referee: [230, 230, 230]
    pitch_lines: [255, 0, 0]
    floor_green: [190, 235, 190]
    background_white: [255, 255, 255]

interactive_viewer:
  source: estim
  x_world_gt: data/x_world_gt/gardien_rennes.npy
  x_world_estim: data/geometric_estim/gardien_rennes/x_world.npy

  start_frame: 0
  play: false
  fps: 50
  temporal_speed: 1.0

  window_width: 1400
  window_height: 900
  window_left: 80
  window_top: 80
  background_color: [0.96, 0.98, 1.0]
  line_width: 35.0
  point_size: 5.0
  floor_color_mode: fixed
  mesh_show_back_face: true
  pitch_line_z_offset: 0.05
  show_axes: true

  initial_camera:
    position: [-25.0, -65.0, 24.0]
    look_at: [-25.0, -10.0, 1.0]
    up: [0.0, 0.0, 1.0]

  camera_mode: field_orbit
  field_orbit_center: [-25.0, -10.0, 1.0]
  field_orbit_min_elevation_deg: 5.0
  field_orbit_max_elevation_deg: 75.0
  field_orbit_min_distance_m: 8.0
  field_orbit_yaw_step_deg: 4.0
  field_orbit_pitch_step_deg: 3.0
  field_orbit_zoom_step_m: 5.0

  mouse_look: false
  capture_cursor: false
