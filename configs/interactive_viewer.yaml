sequence:
  name: ARG_FRA_182345
  fps: 50

paths:
  pitch_points: data/pitch/pitch_points.txt
  teams: data/teams/ARG_FRA_182345.txt

render:
  colors:
    team_a: [30, 120, 255]
    team_b: [255, 140, 0]
    fallback: [180, 180, 180]
    referee: [230, 230, 230]
    pitch_lines: [255, 0, 0]
    floor_green: [190, 235, 190]
