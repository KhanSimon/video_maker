  x_world_estim: data/x_world_estim/ARG_FRA_182345.npy
  gt_color: [255, 0, 0]
  gt_z_offset: 0.04

  start_frame: 0
  play: false
  fps: 50
  temporal_speed: 1.0  # borne par les controles entre 0.25 et 2.0

  window_width: 1400
  window_height: 900
  window_left: 80
  window_top: 80
  background_color: [0.96, 0.98, 1.0]
  line_width: 5.0
  point_size: 5.0
  pitch_line_z_offset: 0.05
  show_axes: true

  move_step_m: 2.0
  camera_zoom: 0.32
  initial_front: [0.05, -0.62, -0.78]

  mouse_look: false
  capture_cursor: true  # macOS: cache le curseur et le recentre pour tourner sans limite
  mouse_sensitivity: 1.9
